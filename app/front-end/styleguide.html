<!doctype html>
<!-- Matches index.html's default so the two pages agree on first paint.
     Unlike the app, this page keeps all three themes on its own switcher —
     proving the paper theme still works is part of its job. -->
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meowtro · Design System</title>
    <!-- SVG rather than .ico: one file that repaints itself for light and
         dark browser chrome, which a raster icon cannot do. See the note
         inside the file for why the ear is cut flat. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,300..900,0..100,0..1&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/styleguide-main.tsx"></script>
  </body>
</html>
