<!doctype html>
<!-- The front door. This is `/`, and the app is app.html. One door in.

     data-theme="light" here is only the fallback for the instant before
     the shared head script runs; the real starting value is decided there.
     See head.html for why it is set on the tag at all. -->
<html lang="en" data-theme="light">
  <head>
    <!--head-->
    <title>Meowtro · A field guide to the community cats of BGC</title>
    <meta
      name="description"
      content="A hand-drawn field guide to the community cats of Bonifacio Global City, Taguig. Every cat is mapped by the territory it roams, never by a pin."
    />

    <!-- Open Graph only. LinkedIn and GitHub both read og:*, and they are
         the two places this gets posted; a twitter:card block would be
         markup for a site nobody here shares to.

         og:url and og:image are deliberately absent rather than guessed.
         Both must be absolute, so both need the deploy URL, which does not
         exist yet (the roadmap keeps deploy out of phase 7 on purpose).
         A preview with a title and no picture is a smaller loss than one
         pointing at a 404. Add them in the same commit as the domain. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Meowtro" />
    <meta property="og:locale" content="en_PH" />
    <meta property="og:title" content="Meowtro · Community cats of Bonifacio Global City" />
    <meta
      property="og:description"
      content="A hand-drawn field guide to the community cats of BGC. Mapped by territory, never by a pin."
    />

  </head>
  <body>
    <div id="root"></div>
    <!-- The page is one <div> until the module runs, so without this a
         no-JS visitor gets a blank screen and no explanation. Styled inline
         because app.css has not loaded either at this point. -->
    <noscript>
      <div
        style="
          font: 500 16px/1.5 system-ui, sans-serif;
          max-width: 34rem;
          margin: 20vh auto;
          padding: 0 1.5rem;
          text-align: center;
        "
      >
        <h1 style="font-size: 1.5rem; margin: 0 0 0.75rem">Meowtro</h1>
        <p style="margin: 0">
          A field guide to the community cats of Bonifacio Global City. The map is drawn in the
          browser, so this one needs JavaScript on to show you anything.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/landing-main.tsx"></script>
  </body>
</html>
